<!-- The favicon's mine, drawn for the install icon. Rounded corners are part of
     the artwork here because an "any" icon is shown as-is; the maskable
     variant next door draws the same mine full-bleed instead. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512">
  <rect width="32" height="32" rx="6" fill="#c0c0c0"/>
  <circle cx="16" cy="17" r="8" fill="#202020"/>
  <rect x="14.5" y="3" width="3" height="7" fill="#202020"/>
  <circle cx="13" cy="14" r="2" fill="#fff"/>
</svg>
