server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript image/svg+xml
               application/json application/manifest+json;

    # Traefik terminates TLS; these are the headers worth setting anyway.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The service worker must never be answered from the browser's HTTP cache,
    # or a deploy cannot replace the worker that caches the deploy. Modern
    # browsers already bypass the cache for this request; saying so explicitly
    # costs one header and covers the ones that do not.
    #
    # add_header does not merge with an outer block's — declaring one here
    # drops all three from the server above — so the security headers are
    # repeated rather than inherited.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
    }

    # The empty types block is what makes default_type apply. Left out, nginx
    # resolves .json from its mime map to application/json and default_type is
    # never consulted, because default_type only covers extensions the map
    # does not already know.
    location = /manifest.json {
        types { }
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
